name: Build Minimal LiveContainer + SideStore

on:
  workflow_dispatch:
    inputs:
      pinned:
        description: Use historical pinned commits instead of latest upstream
        type: boolean
        default: false
  schedule:
    - cron: '0 0 * * *'
  push:
    paths:
      - '.github/workflows/build-minimal.yml'
      - 'sidestore-zh/**'

permissions:
  contents: read

concurrency:
  group: sidestore-minimal-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check pipeline behavior
        run: python3 -m unittest discover -s sidestore-zh/tests -v
      - uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: ${{ vars.XCODE_VERSION || '26.4' }}
      - name: Restore last successful input state
        uses: actions/cache/restore@v4
        with:
          path: sidestore-zh/.last-success/minimal
          key: minimal-state-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: minimal-state-${{ github.ref_name }}-
      - name: Check both upstreams
        id: check
        env:
          USE_PINNED: ${{ inputs.pinned }}
        run: |
          args=()
          if [[ "$USE_PINNED" == 'true' ]]; then args+=(--pinned); fi
          python3 -u sidestore-zh/build.py check --variant minimal "${args[@]}"
      - name: Record toolchain
        if: steps.check.outputs.should_build == 'true'
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          python3 --version
      - name: Prepare pinned inputs and translation
        if: steps.check.outputs.should_build == 'true'
        run: python3 -u sidestore-zh/build.py prepare --variant minimal
      - name: Check minimal controller against selected SDK
        if: steps.check.outputs.should_build == 'true'
        run: python3 sidestore-zh/scripts/typecheck_minimal.py --source sidestore-zh/.build/minimal/work/SideStore
      - name: Compile both projects from source
        if: steps.check.outputs.should_build == 'true'
        run: python3 -u sidestore-zh/build.py build --variant minimal
      - name: Package and verify integration
        if: steps.check.outputs.should_build == 'true'
        run: python3 -u sidestore-zh/build.py package --variant minimal
      - name: Upload IPA and verification
        if: steps.check.outputs.should_build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: LiveContainer-SideStore-Minimal
          path: sidestore-zh/.build/minimal/outputs/*
          if-no-files-found: error
          retention-days: 30
      - name: Record successful build
        if: steps.check.outputs.should_build == 'true'
        run: python3 sidestore-zh/build.py mark-success --variant minimal
      - name: Save successful input state
        if: steps.check.outputs.should_build == 'true'
        uses: actions/cache/save@v4
        with:
          path: sidestore-zh/.last-success/minimal
          key: minimal-state-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minimal-build-logs
          path: |
            sidestore-zh/.build/minimal/work/*.log
            sidestore-zh/.build/minimal/work/*audit.json
            sidestore-zh/.build/minimal/work/build-provenance.json
            sidestore-zh/.build/minimal/candidate.json
          if-no-files-found: ignore
          retention-days: 14
